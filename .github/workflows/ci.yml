name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tgshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tgshop_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate operational scripts
        run: |
          sh -n scripts/backup.sh
          sh -n scripts/verify_backup.sh
          sh -n scripts/verify_offsite_backup.sh
          docker build -f backup.Dockerfile -t tg-shop-backup-check .
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

      - name: Run tests
        run: python -m pytest --tb=short -q
