name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/tg_shop
            previous_sha=$(git rev-parse HEAD)
            target_sha="${{ github.event.workflow_run.head_sha }}"
            git fetch origin master
            git checkout --detach "$target_sha"

            rollback() {
              echo "Deployment failed, rolling back to $previous_sha"
              git checkout --detach "$previous_sha"
              docker compose up -d --build
            }

            trap rollback ERR
            docker compose up -d --build
            # Git replaces bind-mounted files by inode; recreate Caddy so it
            # mounts the newly checked-out config and landing assets.
            docker compose up -d --force-recreate caddy
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

            healthy=false
            for attempt in $(seq 1 12); do
              if docker compose exec -T bot python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"; then
                healthy=true
                break
              fi
              sleep 5
            done

            if [ "$healthy" != "true" ]; then
              echo "Health check failed"
              false
            fi

            trap - ERR
            docker image prune -f
            echo "Deploy of $target_sha completed at $(date)"
