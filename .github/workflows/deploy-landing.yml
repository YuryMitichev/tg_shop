name: Deploy landing only

on:
  workflow_dispatch:
    inputs:
      landing_commit:
        description: Landing-only commit to apply on the production server
        required: true
        default: d2f0b75

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy landing without replacing the running application
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/tg_shop

            previous_sha=$(git rev-parse HEAD)
            landing_commit="${{ inputs.landing_commit }}"
            git fetch origin codex/brandbook-site

            rollback() {
              echo "Landing deployment failed, rolling back to $previous_sha"
              git cherry-pick --abort 2>/dev/null || true
              git checkout --detach "$previous_sha"
              docker compose up -d --force-recreate caddy
            }

            trap rollback ERR
            git cherry-pick "$landing_commit"
            docker compose up -d --force-recreate caddy
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            curl --fail --silent --show-error --max-time 20 https://svoi-kanal.ru/ > /dev/null
            trap - ERR
            echo "Landing commit $landing_commit deployed on top of $previous_sha"
