<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.min.css?v=4">
</head>
<body>

<!-- Каталог -->
<div id="view-catalog" class="view active">
    <div id="categories" class="categories"></div>
    <div id="products" class="products-grid"></div>
</div>

<!-- Карточка товара -->
<div id="view-product" class="view">
    <div class="header">
        <button class="back-btn" onclick="App.showCatalog()">←</button>
    </div>
    <div id="product-detail"></div>
</div>

<!-- Корзина -->
<div id="view-cart" class="view">
    <div class="header">
        <h2>🛒 Корзина</h2>
    </div>
    <div id="cart-items"></div>
    <div id="cart-footer"></div>
</div>

<!-- Оформление -->
<div id="view-checkout" class="view">
    <div class="header">
        <button class="back-btn" onclick="App.showCart()">←</button>
        <h2>Оформление</h2>
    </div>
    <form id="checkout-form" onsubmit="App.submitOrder(event)">
        <label>Имя и фамилия</label>
        <input type="text" id="co-name" required maxlength="100">
        <label>Телефон</label>
        <input type="tel" id="co-phone" required placeholder="+7 999 123-45-67">
        <label>Комментарий (необязательно)</label>
        <textarea id="co-comment" rows="3" placeholder="Пожелания к заказу..."></textarea>

        <label>Промокод (необязательно)</label>
        <div class="promo-row">
            <input type="text" id="co-promo" placeholder="Например: NEW10">
            <button type="button" class="btn-promo" onclick="App.applyPromo()">Применить</button>
        </div>
        <div id="promo-result"></div>

        <label>Способ оплаты</label>
        <div id="payment-methods"></div>

        <div id="co-total" class="co-total"></div>

        <div class="consent-row">
            <label class="consent-label">
                <input type="checkbox" id="co-consent" checked>
                <span>Согласен с <a href="#" onclick="App.showPrivacy(); return false;">политикой конфиденциальности</a> и обработкой персональных данных</span>
            </label>
        </div>

        <button type="submit" class="btn-primary">Оформить заказ</button>
    </form>
</div>

<!-- Заказы -->
<div id="view-orders" class="view">
    <div class="header">
        <h2>📦 Мои заказы</h2>
    </div>
    <div id="orders-list"></div>
</div>

<!-- Заказ оформлен -->
<div id="view-success" class="view">
    <div id="success-content"></div>
</div>

<!-- Товар закончился -->
<div id="view-out-of-stock" class="view">
    <div id="out-of-stock-content"></div>
</div>

<!-- Политика конфиденциальности -->
<div id="view-privacy" class="view">
    <div class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <h2>🔒 Политика конфиденциальности</h2>
    </div>
    <div id="privacy-content" class="privacy-content"></div>
</div>

<!-- Bottom nav -->
<div id="bottom-nav" class="bottom-nav">
    <button class="nav-btn active" onclick="App.showCatalog()">
        <span class="nav-icon">🛍</span>
        <span class="nav-label">Каталог</span>
    </button>
    <button class="nav-btn" onclick="App.showCart()">
        <span class="nav-icon">🛒</span>
        <span class="nav-label">Корзина</span>
        <span id="cart-badge" class="cart-badge" style="display:none">0</span>
    </button>
    <button class="nav-btn" onclick="App.showOrders()">
        <span class="nav-icon">📦</span>
        <span class="nav-label">Заказы</span>
    </button>
</div>

<script src="app.min.js?v=4"></script>
</body>
</html>
