<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="1000" cy="120" r="220" fill="rgba(255,255,255,0.06)"/>
  <circle cx="200" cy="500" r="180" fill="rgba(124, 58, 237, 0.15)"/>

  <!-- Logo icon -->
  <rect x="80" y="70" width="56" height="56" rx="14" fill="rgba(255,255,255,0.15)"/>
  <path d="M98 86h28l-3 8H98l-2 6h21l-3 8H91l-3 8h28" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand name -->
  <text x="148" y="108" font-family="-apple-system, Arial, sans-serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.9)">Свой канал</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="-apple-system, Arial, sans-serif" font-size="68" font-weight="800" fill="#fff" letter-spacing="-2">
    <tspan x="80" dy="0">Магазин внутри</tspan>
    <tspan x="80" dy="78">Telegram</tspan>
  </text>

  <!-- Subheadline -->
  <text x="80" y="440" font-family="-apple-system, Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.8)">
    <tspan x="80" dy="0">Каталог, корзина, оплата и CRM — прямо в боте.</tspan>
    <tspan x="80" dy="36">Без сайта. Без переписки. Без потерянных заказов.</tspan>
  </text>

  <!-- Badge -->
  <rect x="80" y="530" width="320" height="52" rx="26" fill="rgba(255,255,255,0.15)"/>
  <text x="240" y="562" font-family="-apple-system, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">7 дней бесплатно · без карты</text>
</svg>
