services:
  postgres:
    image: postgres:16-alpine
    container_name: tg_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_shop
      POSTGRES_USER: tg_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - shopnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_shop -d tg_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    container_name: tg_shop_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://tg_shop:${POSTGRES_PASSWORD:-changeme}@postgres:5432/tg_shop
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopnet

  admin:
    build:
      context: ./admin
      args:
        - NEXT_PUBLIC_API_BASE=${APP_BASE_URL:-https://svechevarov-family.ru}
    container_name: tg_shop_admin
    restart: unless-stopped
    networks:
      - shopnet
    depends_on:
      - bot

  caddy:
    image: caddy:2-alpine
    container_name: tg_shop_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shopnet
    depends_on:
      - bot
      - admin

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  shopnet:
