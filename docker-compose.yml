services:
  bot:
    build: .
    container_name: tg_shop_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/shop.db
    volumes:
      - bot_data:/app/data
    networks:
      - shopnet

  admin:
    build:
      context: ./admin
      args:
        - NEXT_PUBLIC_API_BASE=${APP_BASE_URL:-https://svechevarov-family.ru}
    container_name: tg_shop_admin
    restart: unless-stopped
    networks:
      - shopnet
    depends_on:
      - bot

  caddy:
    image: caddy:2-alpine
    container_name: tg_shop_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shopnet
    depends_on:
      - bot
      - admin

volumes:
  bot_data:
  caddy_data:
  caddy_config:

networks:
  shopnet:
